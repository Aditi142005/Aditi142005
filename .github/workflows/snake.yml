name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: Aditi142005
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publish snake
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Aditi142005/Aditi142005.git repo

          mkdir -p repo/snake
          cp dist/github-contribution-grid-snake.svg repo/snake/
          cp dist/github-contribution-grid-snake-dark.svg repo/snake/

          cd repo
          git add snake/
          git diff --cached --quiet || git commit -m "Generate contribution snake"
          git push
